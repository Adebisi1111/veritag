<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VeriTag">
  <title>VeriTag</title>
  <!-- Favicon variant: solid emerald tile, no eyelet, heavier check.
